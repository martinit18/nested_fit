version: 5.6
calculation_mode: DATA
datafiles:  out_points.csv
specstr:    x,c,ce
filefmt:    .csv
likelihood: GAUSSIAN

function:
  expression: two_gauss(x, x_1, s_1, a_1, x_2, s_2, a_2) = \texttt{GAUSS_IF}(x, x_1, a_1, s_1) + \texttt{GAUSS_IF}(x, x_2, a_2, s_2)
  params:
    x_1:  { value: 5.0,   step: -1, min: 4.0,   max: 6.0   }
    s_1:  { value: 0.2,   step: -1, min: 0.1,   max: 0.3   }
    a_1:  { value: 90.0,  step: -1, min: 80.0,  max: 100.0 }
    x_2:  { value: 10.0,  step: -1, min: 9.0,   max: 11.0  }
    s_2:  { value: 0.1,   step: -1, min: 0.0,   max: 0.2   }
    a_2:  { value: 110.0, step: -1, min: 100.0, max: 120.0 }

data: { xmin: 0, xmax: 100, ymin: 0, ymax: 0 }

search:
  livepoints: 2048
  method:     SLICE_SAMPLING
  param1:     0.5
  param2:     3
  max_tries:  1000
  tries_mult: 100
  max_steps:  1000000

convergence:
  method:    LIKE_ACC
  accuracy:  1.E-05
